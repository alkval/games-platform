services:
  games:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/games.db
    volumes:
      - games_data:/app/data
    networks:
      - games_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    depends_on:
      games:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    networks:
      - games_net
    security_opt:
      - no-new-privileges:true

volumes:
  games_data:

networks:
  games_net:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

