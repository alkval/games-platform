services:
  games:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/games.db
    volumes:
      - games_data:/app/data
    networks:
      - games_net
      - public_tunnel
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  games_data:

networks:
  games_net:
  public_tunnel:
    external: true
    name: ${PUBLIC_TUNNEL_NETWORK:-portfolio_default}
